name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: Windows risk-module import smoke test
        if: runner.os == 'Windows'
        run: python -c "import qijing_spike.capture, qijing_spike.overlay, qijing_spike.registration, qijing_spike.window; print('windows imports ok')"
